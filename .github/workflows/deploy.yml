name: Deploy

# Auto-deploys nousergon-console to the dashboard box on every push to main.
# Mirrors crucible-dashboard's deploy-on-merge pattern: GHA assumes the OIDC
# role, SSM send-command pulls the pinned SHA and runs infrastructure/deploy-on-merge.sh.
#
# The box is SSM-only (SSH closed). The process binds 127.0.0.1:5180; nginx on
# the box is the sole ingress (flipped to this port by crucible-dashboard's
# I364 nginx change). Cloudflare Access on console.nousergon.ai is the sole
# authenticator.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy console via SSM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DASHBOARD_INSTANCE_ID: ${{ vars.DASHBOARD_INSTANCE_ID }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d  # v6
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Require DASHBOARD_INSTANCE_ID
        run: |
          set -euo pipefail
          if [ -z "${DASHBOARD_INSTANCE_ID}" ]; then
            echo "DASHBOARD_INSTANCE_ID repo variable is unset — refuse to deploy"
            exit 1
          fi

      - name: Send SSM deploy command
        id: send
        run: |
          set -euo pipefail
          # Two-phase body:
          #   1. Pull the workflow-pinned SHA as ec2-user (refreshes the deploy script).
          #   2. Run the freshly-pulled deploy script as root (systemctl needs it).
          CMD_BODY="set -euo pipefail; if [ ! -d /home/ec2-user/nousergon-console/.git ]; then sudo -u ec2-user git clone https://github.com/nousergon/nousergon-console.git /home/ec2-user/nousergon-console; fi; cd /home/ec2-user/nousergon-console; sudo -u ec2-user git fetch --prune origin; sudo -u ec2-user git checkout -f ${GITHUB_SHA}; bash infrastructure/deploy-on-merge.sh ${GITHUB_SHA}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$DASHBOARD_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "nousergon-console deploy ${GITHUB_SHA}" \
            --parameters "commands=[\"${CMD_BODY}\"]" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command id: $COMMAND_ID"

      - name: Wait for SSM command
        run: |
          set -euo pipefail
          COMMAND_ID="${{ steps.send.outputs.command_id }}"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$DASHBOARD_INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success)
                echo "SSM command succeeded"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$DASHBOARD_INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text | tail -n 40
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "SSM command $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$DASHBOARD_INSTANCE_ID" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' --output text || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "timed out waiting for SSM command"
          exit 1
