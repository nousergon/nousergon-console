name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: §9.8 (onboarding
          # cost) reads this repo's own git log to find when each registry
          # row was added (console/index/onboarding.py), and a shallow clone
          # would truncate that history and misattribute the finding — the
          # code detects and degrades honestly rather than lying, but a
          # shallow CI clone would mean §9.8 is never actually exercised here.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Undefined names (F821) — the class that merged green here
        # `console/adapters/object_store.py` shipped a `_failed` helper that
        # three failure paths called and nothing defined; every one of them
        # raised NameError instead of returning the FAILED envelope §5.5
        # requires (alpha-engine-config-I8765). Nothing on the box hit it,
        # because an adapter's unreadable-source path is precisely the path a
        # healthy run never takes — so the test suite could not be the
        # detector, and this is. One second, and it fails the PR.
        run: ruff check --select F821 .

      - name: Test
        run: python -m pytest tests/ -q
      - name: Build the index against the example config (§3.6 build-time gate)
        # nousergon-console-I4, ruled 2026-08-10: a namespace collision is
        # supposed to "fail the build loudly" — this is that build. Runs the
        # same `console index` a deploy would, against the tracked
        # config.example.yaml fixture, so a collision introduced by a config
        # or adapter change is caught on the PR rather than discovered live.
        # (The real fleet config.yaml is gitignored and unavailable here —
        # this is the fixture-scale gate the runtime degrade in
        # console/index/build.py backs up for anything this can't see.)
        run: python -m console index --config config.example.yaml

      - name: Assert the declared namespace is unique (§3.6, nousergon-console-I80)
        # The step above builds the index, which catches a KIND disagreement —
        # two different things under one identifier — because that raises. It
        # does not catch the case §3.6 names first: two registry rows declaring
        # the same id with the same kind MERGE, so the second shadows the first
        # and the losing row's owner, authority tier and declared lifecycle
        # disappear silently. This asserts the declared namespace — registry
        # rows and registry names, all knowable from committed files — is
        # unique, and fails the PR that introduces a duplicate.
        run: python -m console check-namespace --config config.example.yaml
