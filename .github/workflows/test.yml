name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The badge-publish step below writes `coverage.json` on the orphan
    # `badges` branch through the contents API. Nothing else in this job
    # writes, and the token is scoped no wider than that.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history, not the default shallow clone: §9.8 (onboarding
          # cost) reads this repo's own git log to find when each registry
          # row was added (console/index/onboarding.py), and a shallow clone
          # would truncate that history and misattribute the finding — the
          # code detects and degrades honestly rather than lying, but a
          # shallow CI clone would mean §9.8 is never actually exercised here.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit
      - name: Undefined names (F821) — the class that merged green here
        # `console/adapters/object_store.py` shipped a `_failed` helper that
        # three failure paths called and nothing defined; every one of them
        # raised NameError instead of returning the FAILED envelope §5.5
        # requires (alpha-engine-config-I8765). Nothing on the box hit it,
        # because an adapter's unreadable-source path is precisely the path a
        # healthy run never takes — so the test suite could not be the
        # detector, and this is. One second, and it fails the PR.
        run: ruff check --select F821 .

      # Strict typing, BLOCKING (alpha-engine-config-I12607). Errors recorded in
      # `.basedpyright/baseline.json` are tolerated; any new one fails. On a PR the
      # baseline may only shrink: a count that grew for any rule means the baseline was
      # regenerated to absorb new errors, which is refused.
      # Missing RETURN annotations are not a pyright rule, so ruff's ANN rules run
      # over every source file the PR adds or changes: touch a file, annotate it.
      - name: Type check (basedpyright strict, baseline may only shrink)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          basedpyright --pythonpath "$(command -v python)"
          if ! git diff --quiet -- .basedpyright/baseline.json; then
            echo "::warning::type errors were fixed but .basedpyright/baseline.json was not shrunk; run basedpyright locally and commit the smaller baseline."
            git checkout -- .basedpyright/baseline.json
          fi
          if [ -n "${BASE_REF}" ] && git fetch --quiet --depth=1 origin "${BASE_REF}"; then
            mapfile -t changed < <(git diff --name-only --diff-filter=AMR FETCH_HEAD HEAD -- 'console/*.py')
            if [ "${#changed[@]}" -gt 0 ]; then
              ruff check --select ANN --ignore ANN401 "${changed[@]}"
            fi
            if git cat-file -e "FETCH_HEAD:.basedpyright/baseline.json" 2>/dev/null; then
              git show "FETCH_HEAD:.basedpyright/baseline.json" > /tmp/baseline-base.json
              git show "HEAD:.basedpyright/baseline.json" > /tmp/baseline-head.json 2>/dev/null \
                || echo '{"files": {}}' > /tmp/baseline-head.json
              python3 - <<'PY'
          import collections, json, sys
          def counts(path):
              files = json.load(open(path))["files"]
              return collections.Counter(e["code"] for es in files.values() for e in es)
          base, head = counts("/tmp/baseline-base.json"), counts("/tmp/baseline-head.json")
          grown = {c: (base[c], n) for c, n in head.items() if n > base[c]}
          for code, (b, n) in sorted(grown.items()):
              print(f"::error::type baseline grew for {code}: {b} -> {n}. Fix the new errors instead of re-baselining.")
          sys.exit(1 if grown else 0)
          PY
            fi
          fi

      - name: Test
        run: python -m pytest tests/ -q --cov=console --cov-report=term-missing

      # repository-baseline-policy.md §5.1 — a badge whose value is written by
      # a human is forbidden: it renders identically to a real one and becomes
      # false the moment reality moves without anyone editing a file. This
      # repo carried no coverage badge and no enforced floor at all
      # (alpha-engine-config-I10432 RB-4.2-C2/RB-5.1). The README badge now
      # renders whatever this step last published, derived from the same
      # `.coverage` file the pyproject.toml gate reads.
      #
      # Pushes to main only: a pull-request run measures a tree that is not
      # yet what a reader of the README is looking at.
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_coverage_badge.sh

      - name: Build the index against the example config (§3.6 build-time gate)
        # nousergon-console-I4, ruled 2026-08-10: a namespace collision is
        # supposed to "fail the build loudly" — this is that build. Runs the
        # same `console index` a deploy would, against the tracked
        # config.example.yaml fixture, so a collision introduced by a config
        # or adapter change is caught on the PR rather than discovered live.
        # (The real fleet config.yaml is gitignored and unavailable here —
        # this is the fixture-scale gate the runtime degrade in
        # console/index/build.py backs up for anything this can't see.)
        run: python -m console index --config config.example.yaml

      - name: Assert the declared namespace is unique (§3.6, nousergon-console-I80)
        # The step above builds the index, which catches a KIND disagreement —
        # two different things under one identifier — because that raises. It
        # does not catch the case §3.6 names first: two registry rows declaring
        # the same id with the same kind MERGE, so the second shadows the first
        # and the losing row's owner, authority tier and declared lifecycle
        # disappear silently. This asserts the declared namespace — registry
        # rows and registry names, all knowable from committed files — is
        # unique, and fails the PR that introduces a duplicate.
        run: python -m console check-namespace --config config.example.yaml
