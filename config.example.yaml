# nousergon-console — configuration shape.
#
# Copy to `config.yaml` (gitignored) and fill in. Everything specific to YOUR
# systems lives here and nowhere else in this repository: if a bucket name, ARN,
# host, port, path or component id has to be compiled into source for the console
# to work, that is a defect in the adapter, not a reason to hardcode it.
#
# Nothing below is read at build time. The console reads this at start and
# derives its entity index, navigation, search index and relation graph from
# whatever the enabled adapters return.

console:
  # Where the process listens. Loopback is the default and is what makes the
  # absence of authentication correct rather than negligent — change it only
  # alongside a real authentication story.
  bind: 127.0.0.1
  port: 5180

  # How old a row may be, relative to its own declared cadence, before it renders
  # as stale rather than as its last value. A multiplier, not an absolute.
  staleness_factor: 1.5

  # How often the index is rebuilt from the adapters. The index has an as-of
  # like everything else, and it is the one that bounds every row's: a surface
  # built once at start and served all day renders every row frozen at boot
  # while looking exactly like a live one — and it is invisible precisely
  # because the rows stay internally consistent WITH EACH OTHER.
  #
  # The rebuild swaps atomically, so a request never sees a half-built index.
  # A rebuild that FAILS keeps serving the previous one and says so, rather
  # than emptying the surface or pretending to be current.
  #
  # This cadence is rendered on every page: an interval nobody can see is a
  # claim about freshness that cannot be checked.
  refresh_seconds: 60

  # §9.8 (onboarding cost) reads THIS repository's own git history to find
  # when each registry row was added. Defaults to the process's working
  # directory (the same convention `--config config.yaml` already assumes);
  # set this only when the console runs from somewhere other than its own
  # checkout.
  # repo_root: /path/to/nousergon-console

# The component denominator. The console renders what it knows about and reports
# the difference between this set and what it can actually see — that difference
# is the transparency-gap count, and it is published on the surface.
#
# Without a registry the console still runs: it indexes whatever the adapters
# return and reports population completeness as unknown rather than as 1.0.
registry:
  adapter: yaml-directory
  path: ./example/registry.d          # one file per component
  id_field: component_id

# One entry per source of truth. Each is handled by exactly one adapter, and no
# adapter knows about any other — cross-source relations are formed by the index
# over entity identifiers, never inside an adapter.
adapters:

  - name: checks
    kind: object-store               # s3-compatible — keys → Artifact entities
    enabled: false
    produces: [component, run, artifact]
    config:
      bucket: your-bucket
      prefix: ops/checks/
      # How a key maps to an entity id. Named groups become entity fields.
      key_pattern: "ops/checks/(?P<component_id>[^/]+)/latest.json"
      cadence: 1h                    # declared, so staleness is computable

  # Fleet-flavoured example (synthetic names only). Prefer checks-envelope
  # over object-store when the objects are fleet check-result envelopes: the
  # body carries status/ran_at/cadence and the entity kind is Component, not
  # Artifact. See docs/adapters.md.
  - name: fleet-checks
    kind: checks-envelope            # ops/checks/<id>/latest.json → Component
    enabled: false
    produces: [component, run, artifact]
    config:
      bucket: your-bucket
      prefix: ops/checks/
      key_pattern: "ops/checks/(?P<component_id>[^/]+)/latest\\.json"
      staleness_factor: 1.5          # multiplier on each envelope's cadence_minutes

  - name: repos
    kind: git-host                   # github / gitlab api
    enabled: false
    produces: [decision, incident]
    config:
      org: your-org
      # Trackers to index. Issues and pull requests become Decision entities;
      # anything carrying an incident label becomes an Incident.
      repos: []
      incident_label: incident

  - name: pipelines
    kind: state-machine              # step functions / airflow / equivalent
    enabled: false
    produces: [run, cycle, artifact]
    config:
      region: your-region
      # Synthetic example shape — real ARNs live only in the private config.yaml.
      state_machines:
        - arn:aws:states:xx-example-1:000000000000:stateMachine:example-pipeline
      # What a "cycle" means here — the join key for "what else broke when this
      # broke" and "what did this cycle cost". Must match a field in each
      # execution's input payload.
      cycle_key: execution_date

  - name: pipeline-reliability
    kind: pipeline-reliability        # trading-day rollup over the same SF source
    enabled: false
    produces: [cycle, signal]
    config:
      region: your-region
      # Same state machines as `pipelines` above, plus what each one is called
      # and whether its history entered any of the named "degraded" states.
      # `degraded_state_names` is optional and per-pipeline (§2.3) — a state
      # name from THIS pipeline's own Step Functions definition, never a
      # literal this adapter assumes. Costs one extra GetExecutionHistory
      # call per execution and is only paid when declared.
      state_machines:
        - arn: arn:aws:states:xx-example-1:000000000000:stateMachine:example-preopen
          pipeline_key: preopen
          measure_buffer: true
          degraded_state_names: []
      # Every SF execution's input carries this field (fleet convention:
      # "pipeline_role", Option-D taxonomy) — which values count as the
      # scheduled/cadence run vs an operator-initiated overlay that may
      # complete a cycle after a scheduled failure. Both are per-deployment,
      # never hardcoded (§2.3).
      role_field: pipeline_role
      cadence_roles: [daily]
      recovery_roles: [watch-rerun, recovery]
      window_trading_days: 20
      # 06:30 America/Los_Angeles is the fleet's market-open reference for the
      # preopen buffer trend; a different deployment names its own.
      open_time: "06:30"
      open_timezone: America/Los_Angeles

  # A SQLite-shaped database a research/scoring pipeline already writes to.
  # Each named query's rows become the entities — a Decision per (ticker,
  # eval_date), a Run per (team, eval_date) — never a fact about one
  # already-known component (that shape is the `sql-source` DRIVER, bound
  # from a component descriptor, not this adapter). See docs/adapters.md.
  - name: research-db
    kind: sql-query
    enabled: false
    produces: [signal, decision, run]
    config:
      db_path: /path/to/research.db
      queries:
        # Signal: one row per (ticker, score_date) from the pipeline's own
        # persisted scoring history — the direct source of truth for "how has
        # this ticker's score evolved."
        - name: score-history
          entity_kind: signal
          query: "SELECT symbol AS ticker, score_date, score FROM score_performance"
          id_template: "{ticker}:{score_date}"
          as_of_field: score_date
        # A second claim about the SAME (ticker, score_date) identifier, from
        # a different table — merges by identifier (§2.5), no join needed.
        - name: investment-thesis
          entity_kind: signal
          query: "SELECT symbol AS ticker, date AS score_date, thesis_summary, conviction, price_target FROM investment_thesis"
          id_template: "{ticker}:{score_date}"
          as_of_field: score_date
        # Decision: one row per (ticker, eval_date) that reached a CIO
        # ruling, enriched with the scanner-stage funnel context via a SQL
        # join rather than a second competing claim (two claims proposing
        # different raw `state` values for one id would render a spurious
        # §2.5 conflict — a join keeps it one row, one state).
        - name: cio-decisions
          entity_kind: decision
          query: >-
            SELECT c.ticker, c.eval_date, c.team_id, c.cio_decision, c.cio_rank,
                   c.cio_conviction, c.final_score, c.rationale, s.sector,
                   s.quant_filter_pass, s.filter_fail_reason
            FROM cio_evaluations c
            LEFT JOIN scanner_evaluations s
              ON s.ticker = c.ticker AND s.eval_date = c.eval_date
          id_template: "{ticker}:{eval_date}"
          state_field: cio_decision
          as_of_field: eval_date
          facets: {team_id: team_id}
        # Run: one row per (team_id, eval_date) — a team's weekly review
        # cycle. Existence in `team_candidates` declares the cycle happened
        # (`default_state`), since the table carries no separate status
        # column; the candidate list rides along as a self-describing field
        # via SQLite's own JSON aggregation, so no second query is needed for
        # drill-to-rows (§3.4).
        - name: sector-team-runs
          entity_kind: run
          query: >-
            SELECT eval_date, team_id, COUNT(*) AS n_candidates,
                   SUM(CASE WHEN team_recommended THEN 1 ELSE 0 END) AS n_recommended,
                   json_group_array(json_object(
                     'ticker', ticker, 'quant_rank', quant_rank,
                     'quant_score', quant_score, 'qual_score', qual_score,
                     'team_recommended', team_recommended
                   )) AS candidates_json
            FROM team_candidates
            GROUP BY eval_date, team_id
          id_template: "{team_id}:{eval_date}"
          default_state: HEALTHY
          as_of_field: eval_date
          facets: {team_id: team_id}
          json_columns: [candidates_json]
        # Run: one row per eval_date — the weekly scanner cycle, with the
        # full per-ticker gate result carried as a declared field rather than
        # a separate per-ticker entity (Universe Board, below, already owns
        # the per-ticker Artifact view of the same gate).
        - name: scanner-cycles
          entity_kind: run
          query: >-
            SELECT eval_date, COUNT(*) AS n_total,
                   SUM(CASE WHEN quant_filter_pass THEN 1 ELSE 0 END) AS n_quant_pass,
                   SUM(CASE WHEN liquidity_pass THEN 1 ELSE 0 END) AS n_liquidity_pass,
                   SUM(CASE WHEN volatility_pass THEN 1 ELSE 0 END) AS n_volatility_pass,
                   SUM(CASE WHEN balance_sheet_pass THEN 1 ELSE 0 END) AS n_balance_sheet_pass,
                   json_group_array(json_object(
                     'ticker', ticker, 'sector', sector, 'tech_score', tech_score,
                     'quant_filter_pass', quant_filter_pass,
                     'filter_fail_reason', filter_fail_reason
                   )) AS tickers_json
            FROM scanner_evaluations
            GROUP BY eval_date
          id_template: "{eval_date}"
          default_state: HEALTHY
          as_of_field: eval_date
          json_columns: [tickers_json]
        # Signal: one row per (eval_date, focus_team_id) — the weekly focus-
        # list summary. Empty before this pipeline's schema migration date is
        # an honest absence (zero rows), rendered by the generic list pane as
        # "no entities" rather than a bespoke placeholder — no special-cased
        # code needed for a column that simply has not started being written
        # yet.
        - name: focus-list-weekly
          entity_kind: signal
          query: >-
            SELECT eval_date, COALESCE(focus_team_id, override_team_id) AS focus_team_id,
                   COUNT(*) AS n_focus_list,
                   SUM(CASE WHEN agent_override THEN 1 ELSE 0 END) AS n_overrides
            FROM scanner_evaluations
            WHERE focus_team_id IS NOT NULL OR agent_override = 1
            GROUP BY eval_date, COALESCE(focus_team_id, override_team_id)
          id_template: "{eval_date}:{focus_team_id}"
          as_of_field: eval_date
          facets: {focus_team_id: focus_team_id}

  # A single snapshot object whose body is a scored universe — one entity per
  # record inside it, not one entity for the object as a whole (that shape is
  # `object-store`, above). See docs/adapters.md.
  - name: universe-board
    kind: object-store-records
    enabled: false
    produces: [artifact]
    config:
      bucket: your-bucket
      keys: ["scanner/universe/latest.json"]
      entity_kind: artifact
      records_path: stocks
      id_template: "{ticker}"
      body_as_of_field: as_of
      state_field: gate.quant_filter_pass   # dotted path into the record
      facets: {sector: sector}

  - name: attractiveness-trends
    kind: object-store-records
    enabled: false
    produces: [signal]
    config:
      bucket: your-bucket
      keys: ["scanner/universe/trajectory/latest.json"]
      entity_kind: signal
      records_path: stocks
      # `as_of` is a top-level body field, not a per-record one — injected
      # into each record's format context (never overriding a genuine
      # per-record field of the same name).
      id_template: "{ticker}:{as_of}"
      body_as_of_field: as_of
      facets: {sector: sector}

  # A dated family of Artifacts under one prefix — the EXISTING `object-store`
  # adapter, reused rather than extended: the identifier IS the key, exactly
  # what this adapter already projects, so a weekly universe-membership
  # snapshot needs a config entry and no new code. Retention-bounded history
  # (`console/history.py`, #48) then answers "what changed week to week" as a
  # query over this Artifact's retained versions — not a bespoke churn
  # adapter.
  - name: universe-membership
    kind: object-store
    enabled: false
    produces: [artifact]
    config:
      bucket: your-bucket
      prefix: universe_membership/
      key_pattern: "universe_membership/(?P<run_date>[^/]+)/membership\\.json"
      cadence: 1w

  - name: schedules
    kind: local-units                # systemd / launchd / cron
    enabled: false
    produces: [component, run]
    config:
      # A unit present here but absent from the registry renders UNREGISTERED;
      # a registry row with no unit renders ABSENT. Both are findings, and they
      # are different findings.
      unit_prefixes: []

# Facets are fields on entities, faceted uniformly by the index. No view
# implements its own filtering. Listing a facet here makes it a slicing
# dimension everywhere; omitting one does not hide the field.
facets:
  - owner
  - substrate
  - repo
  - environment
  - authority_tier
  - lifecycle
  - pipeline

# Optional. Where the console's own execution telemetry goes — it is a component
# like any other, and a surface that cannot be seen to have stopped is the
# failure this whole project is about.
self:
  component_id: nousergon-console
  emit: stdout
