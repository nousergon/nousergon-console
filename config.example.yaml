# nousergon-console — configuration shape.
#
# Copy to `config.yaml` (gitignored) and fill in. Everything specific to YOUR
# systems lives here and nowhere else in this repository: if a bucket name, ARN,
# host, port, path or component id has to be compiled into source for the console
# to work, that is a defect in the adapter, not a reason to hardcode it.
#
# Nothing below is read at build time. The console reads this at start and
# derives its entity index, navigation, search index and relation graph from
# whatever the enabled adapters return.

console:
  # Where the process listens. Loopback is the default and is what makes the
  # absence of authentication correct rather than negligent — change it only
  # alongside a real authentication story.
  bind: 127.0.0.1
  port: 5180

  # How old a row may be, relative to its own declared cadence, before it renders
  # as stale rather than as its last value. A multiplier, not an absolute.
  staleness_factor: 1.5

  # How often the index is rebuilt from the adapters. The index has an as-of
  # like everything else, and it is the one that bounds every row's: a surface
  # built once at start and served all day renders every row frozen at boot
  # while looking exactly like a live one — and it is invisible precisely
  # because the rows stay internally consistent WITH EACH OTHER.
  #
  # The rebuild swaps atomically, so a request never sees a half-built index.
  # A rebuild that FAILS keeps serving the previous one and says so, rather
  # than emptying the surface or pretending to be current.
  #
  # This cadence is rendered on every page: an interval nobody can see is a
  # claim about freshness that cannot be checked.
  refresh_seconds: 60

  # §9.8 (onboarding cost) reads THIS repository's own git history to find
  # when each registry row was added. Defaults to the process's working
  # directory (the same convention `--config config.yaml` already assumes);
  # set this only when the console runs from somewhere other than its own
  # checkout.
  # repo_root: /path/to/nousergon-console

# The component denominator. The console renders what it knows about and reports
# the difference between this set and what it can actually see — that difference
# is the transparency-gap count, and it is published on the surface.
#
# Without a registry the console still runs: it indexes whatever the adapters
# return and reports population completeness as unknown rather than as 1.0.
registry:
  adapter: yaml-directory
  path: ./example/registry.d          # one file per component
  id_field: component_id

# One entry per source of truth. Each is handled by exactly one adapter, and no
# adapter knows about any other — cross-source relations are formed by the index
# over entity identifiers, never inside an adapter.
adapters:

  - name: checks
    kind: object-store               # s3-compatible — keys → Artifact entities
    enabled: false
    produces: [component, run, artifact]
    config:
      bucket: your-bucket
      prefix: ops/checks/
      # How a key maps to an entity id. Named groups become entity fields.
      key_pattern: "ops/checks/(?P<component_id>[^/]+)/latest.json"
      cadence: 1h                    # declared, so staleness is computable

  # Fleet-flavoured example (synthetic names only). Prefer checks-envelope
  # over object-store when the objects are fleet check-result envelopes: the
  # body carries status/ran_at/cadence and the entity kind is Component, not
  # Artifact. See docs/adapters.md.
  - name: fleet-checks
    kind: checks-envelope            # ops/checks/<id>/latest.json → Component
    enabled: false
    produces: [component, run, artifact]
    config:
      bucket: your-bucket
      prefix: ops/checks/
      key_pattern: "ops/checks/(?P<component_id>[^/]+)/latest\\.json"
      staleness_factor: 1.5          # multiplier on each envelope's cadence_minutes

  - name: repos
    kind: git-host                   # github / gitlab api
    enabled: false
    produces: [decision, incident, artifact]
    config:
      org: your-org
      # Trackers to index. Issues become Decision entities; anything carrying
      # an incident label becomes an Incident.
      repos: []
      incident_label: incident
      # Optional. When true, also lists pull requests: an OPEN pr joins the
      # decision queue at `<repo>-PR<N>` (its own namespace — never collides
      # with an issue of the same number); a MERGED pr becomes an Artifact at
      # `<org>/<repo>#<N>` ("which PRs merged, human or agent"). A closed,
      # unmerged pr answers neither question and is not emitted.
      include_prs: false

  # ---------------------------------------------------------------------
  # Fleet Ops Meta slice (nousergon-console#59) — four more s3-records
  # instances alongside the Portfolio & Trading slice's five above. Field
  # names below are read from the real crucible-dashboard producer/loader
  # pair for each view, not invented.
  # ---------------------------------------------------------------------

  - name: llm-cost-personal
    kind: s3-records
    enabled: false
    produces: [signal]
    config:
      bucket: your-research-bucket
      prefix: claude_code_usage/
      kind: signal                   # one Signal per (source, date, model)
      question: >-
        How much are we spending on pay-per-token LLM calls this week,
        personal vs. research-pipeline?
      key_pattern: "claude_code_usage/(?P<source>[^/]+)/(?P<date>\\d{4}-\\d{2}-\\d{2})\\.json$"
      records_path: models            # fan out the per-model rows in each day's file
      id_template: "{source}:{date}:{model}"
      as_of_field: date
      fields:
        provider: {path: provider, render: text}
        raw_tokens: {path: total, render: count}
        cost_usd: {path: cost_usd, unit: usd}
      # NOT covered here: the research-pipeline half of 23_LLM_Cost.py
      # (per-call Anthropic spend from `decision_artifacts/_cost/{date}/cost.parquet`)
      # — s3-records reads json/csv only; that source is Parquet. See
      # alpha-engine-config-I6805.

  - name: llm-usage-plan
    kind: s3-records
    enabled: false
    produces: [signal]
    config:
      bucket: your-research-bucket
      prefix: claude_code_usage/
      kind: signal                   # one Signal per (source, date) — the flat
                                      # Claude Max 20x quota view, distinct from
                                      # llm-cost-personal above (not a fork —
                                      # different billing mechanism, #59 §Cluster B)
      question: >-
        How much of the flat Claude Max 20x subscription quota has been used,
        and cache efficiency?
      key_pattern: "claude_code_usage/(?P<source>[^/]+)/(?P<date>\\d{4}-\\d{2}-\\d{2})\\.json$"
      id_template: "{source}:{date}"  # whole-body — no per-model fan-out
      as_of_field: date
      fields:
        wet: {path: wet}
        cache_read_input_tokens: {path: cache_read_input_tokens, render: count}
        cache_creation_input_tokens: {path: cache_creation_input_tokens, render: count}

  - name: expenses
    kind: s3-records
    enabled: false
    produces: [signal]
    config:
      bucket: your-research-bucket
      prefix: expenses/
      # A single well-known object (rewritten twice daily), not a dated
      # partition — the pattern names no groups, and id_template below
      # draws entirely on the record's own fields instead.
      key_pattern: "expenses/latest\\.json$"
      kind: signal                   # one Signal per provider row
      question: >-
        Which external providers are trending over/under their monthly
        budget, and what will each cost by month-end?
      records_path: providers
      id_template: "{key}:{period}"   # provider_key : billing period
      as_of_field: as_of
      state_field: pace               # over / under / null
      fields:
        mtd_cost_usd: {path: mtd_cost_usd, unit: usd}
        status: {path: status, render: text}
        source: {path: source, render: text}

  - name: backlog-groom
    kind: s3-records
    enabled: false
    produces: [run]
    config:
      bucket: your-research-bucket
      prefix: groom/
      kind: run                      # one Run per groom/PR-sweep invocation
      question: >-
        Did the groom actually engage each queued backlog issue this run,
        and is the backlog draining?
      key_pattern: "groom/(?P<date>[^/]+)/(?P<run_id>[^/]+)\\.json$"
      id_template: "{date}:{run_id}"
      as_of_field: run_start
      # No single status field on the raw artifact (§5.1: Run resolves
      # through §8.3's closed twelve and must carry one) — a groom run
      # that wrote its artifact at all completed; `floor_fail` below is
      # the degradation signal, surfaced as its own field rather than
      # folded into state.
      state_default: HEALTHY
      fields:
        run_kind: {path: run_kind, render: text}
        engaged: {path: engaged, render: count}
        floor: {path: floor, render: count}
        undispositioned: {path: undispositioned, render: count}
        floor_fail: {path: floor_fail, render: text}

  # 54_PR_Pipeline reads the SAME groom/{date}/*.json artifacts as
  # backlog-groom above (run_kind == "sweep"), a different aggregation
  # (nousergon-console#59 explicitly keeps these as two panes). Its
  # bucket/throughput/verdict counters are NOT plain JSON fields on the
  # artifact, though — crucible-dashboard's loaders/pr_pipeline.py derives
  # them by parsing `digest_markdown`'s prose bold-header sections
  # (config#2709's own documented issue-text-vs-live-artifact gap).
  # s3-records binds structured field paths only; it cannot replicate that
  # parse. Wiring this pane for real needs EITHER the groom producer to also
  # emit those counts as structured JSON (the correct root-cause fix) or a
  # dedicated small parsing adapter mirroring pr_pipeline.py — tracked as
  # alpha-engine-config-I6805, not built here.
  - name: pr-pipeline
    kind: s3-records
    enabled: false
    produces: [cycle]
    config:
      bucket: your-research-bucket
      prefix: groom/
      kind: cycle                    # one Cycle per sweep run
      question: >-
        How are PR-sweep cycles trending over 14 days — bucket sizes, merge
        throughput, gate verdicts?
      key_pattern: "groom/(?P<date>[^/]+)/(?P<run_id>[^/]+)\\.json$"
      id_template: "{date}:{run_id}"
      as_of_field: run_start
      state_field: run_kind           # "sweep" vs "coverage" — verbatim (Cycle
                                      # does not resolve through §8.3)
      fields:
        digest_issue: {path: digest_issue, render: link}
        # bucket/throughput/verdict fields intentionally absent — see above.

  - name: watch-status-sf
    kind: s3-records
    enabled: false
    produces: [incident]
    config:
      bucket: your-research-bucket
      prefix: consolidated/saturday_sf_watch/
      kind: incident                 # one Incident per failure event
      question: >-
        What did the SF Watch / CI Watch agents do the last time a run
        failed, and how well is watch performing?
      key_pattern: "consolidated/saturday_sf_watch/(?P<date>\\d{4}-\\d{2}-\\d{2})\\.json$"
      records_path: events            # many events nested in one date's key —
                                      # failure-driven: a date exists only
                                      # where the pipeline actually failed
      id_template: "{date}:{detected_at}"
      as_of_field: detected_at
      state_field: status             # FAILED / TIMED_OUT / ABORTED — verbatim
      fields:
        failed_state: {path: failed_state, render: text}
        action: {path: action, render: text}
        cause: {path: cause, render: text}

  - name: watch-status-ci
    kind: s3-records
    enabled: false
    produces: [incident]
    config:
      bucket: your-research-bucket
      prefix: consolidated/ci_watch/
      kind: incident                 # same shape, the CI Watch sibling log
      question: >-
        What did the SF Watch / CI Watch agents do the last time a run
        failed, and how well is watch performing?
      key_pattern: "consolidated/ci_watch/(?P<date>\\d{4}-\\d{2}-\\d{2})\\.json$"
      records_path: events
      id_template: "{date}:{repo}:{run_id}"
      state_field: action
      fields:
        repo: {path: repo, render: text}
        workflow: {path: workflow, render: text}
        diagnosis: {path: diagnosis, render: text}

  - name: pipelines
    kind: state-machine              # step functions / airflow / equivalent
    enabled: false
    produces: [run, cycle, artifact]
    config:
      region: your-region
      # Synthetic example shape — real ARNs live only in the private config.yaml.
      state_machines:
        - arn:aws:states:xx-example-1:000000000000:stateMachine:example-pipeline
      # What a "cycle" means here — the join key for "what else broke when this
      # broke" and "what did this cycle cost". Must match a field in each
      # execution's input payload.
      cycle_key: execution_date

  - name: pipeline-reliability
    kind: pipeline-reliability        # trading-day rollup over the same SF source
    enabled: false
    produces: [cycle, signal]
    config:
      region: your-region
      # Same state machines as `pipelines` above, plus what each one is called
      # and whether its history entered any of the named "degraded" states.
      # `degraded_state_names` is optional and per-pipeline (§2.3) — a state
      # name from THIS pipeline's own Step Functions definition, never a
      # literal this adapter assumes. Costs one extra GetExecutionHistory
      # call per execution and is only paid when declared.
      state_machines:
        - arn: arn:aws:states:xx-example-1:000000000000:stateMachine:example-preopen
          pipeline_key: preopen
          measure_buffer: true
          degraded_state_names: []
      # Every SF execution's input carries this field (fleet convention:
      # "pipeline_role", Option-D taxonomy) — which values count as the
      # scheduled/cadence run vs an operator-initiated overlay that may
      # complete a cycle after a scheduled failure. Both are per-deployment,
      # never hardcoded (§2.3).
      role_field: pipeline_role
      cadence_roles: [daily]
      recovery_roles: [watch-rerun, recovery]
      window_trading_days: 20
      # 06:30 America/Los_Angeles is the fleet's market-open reference for the
      # preopen buffer trend; a different deployment names its own.
      open_time: "06:30"
      open_timezone: America/Los_Angeles

  # A family of per-date JSON snapshots under one prefix, projected onto typed
  # Signal or Run entities with declared fields — e.g. a champion/challenger
  # leaderboard (kind: signal) or a per-cycle training-gate result (kind:
  # run). Same lister shape as `object-store`, plus a content read.
  - name: model-cycle-results
    kind: dated-snapshot
    enabled: false
    produces: [run]
    config:
      bucket: your-bucket
      prefix: models/training_summary_
      key_pattern: "models/training_summary_(?P<date>[^/]+)\\.json"
      id_template: "model-training:{date}"
      kind: run
      # A raw value the document carries -> one of §8.3's twelve. Never
      # hardcoded (§2.3) — a value with no entry renders DEGRADED, named, not
      # a fabricated green.
      state_field: promoted
      state_map:
        "True": HEALTHY
        "False": DEGRADED
      fields:
        ic_gate_passed: {path: ic_gate_passed, render: text}
      cadence: 7d

  # A SQLite-shaped database a research/scoring pipeline already writes to.
  # Each named query's rows become the entities — a Decision per (ticker,
  # eval_date), a Run per (team, eval_date) — never a fact about one
  # already-known component (that shape is the `sql-source` DRIVER, bound
  # from a component descriptor, not this adapter). See docs/adapters.md.
  - name: research-db
    kind: sql-query
    enabled: false
    produces: [signal, decision, run]
    config:
      db_path: /path/to/research.db
      queries:
        # Signal: one row per (ticker, score_date) from the pipeline's own
        # persisted scoring history — the direct source of truth for "how has
        # this ticker's score evolved."
        - name: score-history
          entity_kind: signal
          query: "SELECT symbol AS ticker, score_date, score FROM score_performance"
          id_template: "{ticker}:{score_date}"
          as_of_field: score_date
        # A second claim about the SAME (ticker, score_date) identifier, from
        # a different table — merges by identifier (§2.5), no join needed.
        - name: investment-thesis
          entity_kind: signal
          query: "SELECT symbol AS ticker, date AS score_date, thesis_summary, conviction, price_target FROM investment_thesis"
          id_template: "{ticker}:{score_date}"
          as_of_field: score_date
        # Decision: one row per (ticker, eval_date) that reached a CIO
        # ruling, enriched with the scanner-stage funnel context via a SQL
        # join rather than a second competing claim (two claims proposing
        # different raw `state` values for one id would render a spurious
        # §2.5 conflict — a join keeps it one row, one state).
        - name: cio-decisions
          entity_kind: decision
          query: >-
            SELECT c.ticker, c.eval_date, c.team_id, c.cio_decision, c.cio_rank,
                   c.cio_conviction, c.final_score, c.rationale, s.sector,
                   s.quant_filter_pass, s.filter_fail_reason
            FROM cio_evaluations c
            LEFT JOIN scanner_evaluations s
              ON s.ticker = c.ticker AND s.eval_date = c.eval_date
          id_template: "{ticker}:{eval_date}"
          state_field: cio_decision
          as_of_field: eval_date
          facets: {team_id: team_id}
        # Run: one row per (team_id, eval_date) — a team's weekly review
        # cycle. Existence in `team_candidates` declares the cycle happened
        # (`default_state`), since the table carries no separate status
        # column; the candidate list rides along as a self-describing field
        # via SQLite's own JSON aggregation, so no second query is needed for
        # drill-to-rows (§3.4).
        - name: sector-team-runs
          entity_kind: run
          query: >-
            SELECT eval_date, team_id, COUNT(*) AS n_candidates,
                   SUM(CASE WHEN team_recommended THEN 1 ELSE 0 END) AS n_recommended,
                   json_group_array(json_object(
                     'ticker', ticker, 'quant_rank', quant_rank,
                     'quant_score', quant_score, 'qual_score', qual_score,
                     'team_recommended', team_recommended
                   )) AS candidates_json
            FROM team_candidates
            GROUP BY eval_date, team_id
          id_template: "{team_id}:{eval_date}"
          default_state: HEALTHY
          as_of_field: eval_date
          facets: {team_id: team_id}
          json_columns: [candidates_json]
        # Run: one row per eval_date — the weekly scanner cycle, with the
        # full per-ticker gate result carried as a declared field rather than
        # a separate per-ticker entity (Universe Board, below, already owns
        # the per-ticker Artifact view of the same gate).
        - name: scanner-cycles
          entity_kind: run
          query: >-
            SELECT eval_date, COUNT(*) AS n_total,
                   SUM(CASE WHEN quant_filter_pass THEN 1 ELSE 0 END) AS n_quant_pass,
                   SUM(CASE WHEN liquidity_pass THEN 1 ELSE 0 END) AS n_liquidity_pass,
                   SUM(CASE WHEN volatility_pass THEN 1 ELSE 0 END) AS n_volatility_pass,
                   SUM(CASE WHEN balance_sheet_pass THEN 1 ELSE 0 END) AS n_balance_sheet_pass,
                   json_group_array(json_object(
                     'ticker', ticker, 'sector', sector, 'tech_score', tech_score,
                     'quant_filter_pass', quant_filter_pass,
                     'filter_fail_reason', filter_fail_reason
                   )) AS tickers_json
            FROM scanner_evaluations
            GROUP BY eval_date
          id_template: "{eval_date}"
          default_state: HEALTHY
          as_of_field: eval_date
          json_columns: [tickers_json]
        # Signal: one row per (eval_date, focus_team_id) — the weekly focus-
        # list summary. Empty before this pipeline's schema migration date is
        # an honest absence (zero rows), rendered by the generic list pane as
        # "no entities" rather than a bespoke placeholder — no special-cased
        # code needed for a column that simply has not started being written
        # yet.
        - name: focus-list-weekly
          entity_kind: signal
          query: >-
            SELECT eval_date, COALESCE(focus_team_id, override_team_id) AS focus_team_id,
                   COUNT(*) AS n_focus_list,
                   SUM(CASE WHEN agent_override THEN 1 ELSE 0 END) AS n_overrides
            FROM scanner_evaluations
            WHERE focus_team_id IS NOT NULL OR agent_override = 1
            GROUP BY eval_date, COALESCE(focus_team_id, override_team_id)
          id_template: "{eval_date}:{focus_team_id}"
          as_of_field: eval_date
          facets: {focus_team_id: focus_team_id}

  # A single snapshot object whose body is a scored universe — one entity per
  # record inside it, not one entity for the object as a whole (that shape is
  # `object-store`, above). See docs/adapters.md.
  - name: universe-board
    kind: object-store-records
    enabled: false
    produces: [artifact]
    config:
      bucket: your-bucket
      keys: ["scanner/universe/latest.json"]
      entity_kind: artifact
      records_path: stocks
      id_template: "{ticker}"
      body_as_of_field: as_of
      state_field: gate.quant_filter_pass   # dotted path into the record
      facets: {sector: sector}

  - name: attractiveness-trends
    kind: object-store-records
    enabled: false
    produces: [signal]
    config:
      bucket: your-bucket
      keys: ["scanner/universe/trajectory/latest.json"]
      entity_kind: signal
      records_path: stocks
      # `as_of` is a top-level body field, not a per-record one — injected
      # into each record's format context (never overriding a genuine
      # per-record field of the same name).
      id_template: "{ticker}:{as_of}"
      body_as_of_field: as_of
      facets: {sector: sector}

  # A dated family of Artifacts under one prefix — the EXISTING `object-store`
  # adapter, reused rather than extended: the identifier IS the key, exactly
  # what this adapter already projects, so a weekly universe-membership
  # snapshot needs a config entry and no new code. Retention-bounded history
  # (`console/history.py`, #48) then answers "what changed week to week" as a
  # query over this Artifact's retained versions — not a bespoke churn
  # adapter.
  - name: universe-membership
    kind: object-store
    enabled: false
    produces: [artifact]
    config:
      bucket: your-bucket
      prefix: universe_membership/
      key_pattern: "universe_membership/(?P<run_date>[^/]+)/membership\\.json"
      cadence: 1w

  - name: schedules
    kind: local-units                # systemd / launchd / cron
    enabled: false
    produces: [component, run]
    config:
      # A unit present here but absent from the registry renders UNREGISTERED;
      # a registry row with no unit renders ABSENT. Both are findings, and they
      # are different findings.
      unit_prefixes: []

  # One prefix, one event per key — the shared shape behind both the raw
  # event-lake and its vocab-quarantine sibling (nousergon-console#60). Same
  # adapter, two instances: state comes from the declared field/literal, never
  # from key staleness (that is what tells this apart from `object-store`).
  - name: changelog-entries
    kind: changelog-events            # per-event S3 objects → Incident entities
    enabled: false
    produces: [incident]
    config:
      bucket: your-research-bucket
      prefix: changelog/entries/
      key_pattern: ".*/(?P<day>\\d{4}-\\d{2}-\\d{2})/(?P<event_id>[^/]+)\\.json$"
      id_template: "{event_id}"       # assumed unique across days
      state_field: severity           # critical/high/medium/low/informational

  - name: changelog-quarantine
    kind: changelog-events            # same shape, vocab-rejected prefix
    enabled: false
    produces: [incident]
    config:
      bucket: your-research-bucket
      prefix: changelog/quarantine/
      key_pattern: ".*/(?P<day>\\d{4}-\\d{2}-\\d{2})/(?P<event_id>[^/]+)\\.json$"
      id_template: "{day}/{event_id}" # only unique within its day partition
      state_literal: quarantined      # every row here means the same thing

  - name: changelog-retros
    kind: changelog-retro-feed        # one aggregate doc → grouped Incident entities
    enabled: false
    produces: [incident]
    config:
      bucket: your-research-bucket
      key: changelog/retro_candidates.json
      cadence: 1d                     # emitted daily by the docs aggregator

  # `declared-registry` generalises `yaml-directory` to "one YAML document,
  # many entries, any kind" — for a registry that is not shaped one-file-per-
  # component. Two example bindings below: a declared inventory of Artifacts
  # (merges against an `object-store` adapter pointed at the same keys to
  # compute MISSING — declared and never observed) and a declared inventory
  # of Decisions (a rollout's own gate state; nothing else observes it, so
  # this claim renders unmerged).
  - name: artifact-registry
    kind: declared-registry
    enabled: false
    produces: [artifact]
    config:
      path: ./example/artifact-registry.yaml   # one YAML doc: a list or an id-keyed mapping
      kind: artifact
      id_field: key                            # each entry's S3 key, matching object-store's own id
      default_state: absent                    # the honest answer when nothing else claims this key

  - name: observation-registry
    kind: declared-registry
    enabled: false
    produces: [decision]
    config:
      path: ./example/observation-registry.yaml
      kind: decision
      id_field: id
      state_field: state                       # e.g. gated-off / gated-on / always-on, carried verbatim

  # `sql-source` (the ADAPTER) enumerates a whole query the console's config
  # names, returning MANY rows → many entities of a configured kind — the
  # opposite direction from `drivers/sql_source.py`'s per-component, one-row
  # DRIVER. `component_id_field` is optional: when a row names the component
  # it is about, the derived `measures` edge makes it appear as a facet on
  # that Component's own entity page with no bespoke rendering.
  - name: data-integrity
    kind: sql-source
    enabled: false
    produces: [signal]
    config:
      database: /path/to/research.db           # sqlite by default; inject `connect` for another engine
      query: "SELECT phase, ticker, disagreement_pct FROM data_integrity_signals"
      kind: signal
      id_fields: [phase, ticker]
      field_descriptors:
        disagreement_pct: {unit: ratio, baseline: 0.0}

  # ---------------------------------------------------------------------
  # s3-records — a source you do not control the shape of, whose objects
  # already carry one-or-many per-instance records (nousergon-console#54).
  # One adapter, configured five different ways below (Portfolio & Trading
  # slice): whole-body (Performance), CSV rows (Execution), list-of-dicts
  # fan-out (Order Book Rationale), and parallel-array fan-out, twice, for
  # the Optimizer pane's two lenses on one artifact. See docs/adapters.md.
  # ---------------------------------------------------------------------

  - name: portfolio-performance
    kind: s3-records
    enabled: false
    produces: [cycle]
    config:
      bucket: your-executor-bucket
      prefix: consolidated/
      kind: cycle                    # one Cycle per trading date
      question: >-
        What did the portfolio do (NAV, alpha, attribution, positions) over a
        selected window, and does the as-of day's EOD report match the
        emailed version?
      key_pattern: "consolidated/(?P<date>\\d{4}-\\d{2}-\\d{2})/eod_report\\.json$"
      id_template: "{date}"
      as_of_field: generated_at
      cadence: 1d
      fields:
        nav: {path: summary.nav, unit: usd}
        daily_return_pct: {path: summary.daily_return_pct, unit: pct}
        daily_alpha_pct: {path: summary.daily_alpha_pct, unit: pct}
        spy_return_pct: {path: summary.spy_return_pct, unit: pct}

  - name: portfolio-execution
    kind: s3-records
    enabled: false
    produces: [run]
    config:
      bucket: your-executor-bucket
      prefix: ""
      kind: run                      # one Run per trade row
      question: >-
        What trades were executed, and how did fills/slippage compare to
        intended price?
      key_pattern: "trades_full\\.csv$"
      format: csv
      id_template: "{ticker}:{created_at}"
      # A row in trades_full IS a completed execution — there is no separate
      # per-trade status column, so every row maps to the same closed-vocab
      # state (§5.1: Run resolves to a component state and must carry one).
      state_default: HEALTHY
      fields:
        action: {path: action, render: text}
        price_at_order: {path: price_at_order, unit: usd}
        fill_price: {path: fill_price, unit: usd}

  - name: portfolio-order-book-rationale
    kind: s3-records
    enabled: false
    produces: [decision]
    config:
      bucket: your-research-bucket
      prefix: trades/order_book_rationale/
      kind: decision                 # one Decision per (ticker, date)
      question: >-
        Why is each ticker in the universe in its current order-book state
        today?
      key_pattern: "trades/order_book_rationale/(?P<run_id>\\d{10})\\.json$"
      records_path: tickers          # fan out the per-ticker list
      id_template: "{calendar_date}:{ticker}"
      state_field: terminal_state    # the source's own domain vocabulary
      fields:
        research_signal: {path: research.signal, render: text}
        research_score: {path: research.score}
        predictor_direction: {path: predictor.predicted_direction, render: text}
        current_weight: {path: optimizer.current_weight, unit: ratio}
        target_weight: {path: optimizer.target_weight, unit: ratio}

  # Optimizer — merged Decision+Risk pane, two lenses on the SAME artifact
  # (`predictor/optimizer_shadow/{date}.json`). host_execution.py's live
  # routing still delegates to Optimizer.py, not to the split 30_/32_ pages
  # (tests/test_host_execution_wiring.py pins this) — Optimizer.py wins the
  # fork, so both lenses migrate as one Decision-kind pane with two facets
  # rather than two separate panes.
  - name: portfolio-optimizer-decision
    kind: s3-records
    enabled: false
    produces: [decision]
    config:
      bucket: your-research-bucket
      prefix: predictor/optimizer_shadow/
      kind: decision                 # per-ticker sizing lens
      question: >-
        Why did the MVO optimizer assign each stock the target weight it did
        on a given day?
      # The literal date segment excludes the latest.json sidecar and any
      # replays/ re-run without this adapter knowing either convention.
      key_pattern: "predictor/optimizer_shadow/(?P<date>\\d{4}-\\d{2}-\\d{2})\\.json$"
      array_fields: [tickers, sectors, eligibility, alpha_hat, current_weights, target_weights, stance_caps]
      id_template: "{date}:{tickers}"
      state_field: eligibility
      fields:
        sector: {path: sectors, render: text}
        alpha_hat: {path: alpha_hat}
        current_weight: {path: current_weights, unit: ratio}
        target_weight: {path: target_weights, unit: ratio}
        stance_cap: {path: stance_caps, unit: ratio}

  - name: portfolio-optimizer-risk
    kind: s3-records
    enabled: false
    produces: [signal]
    config:
      bucket: your-research-bucket
      prefix: predictor/optimizer_shadow/
      kind: signal                   # per-day lever/risk-posture lens
      question: >-
        How have the optimizer's deployed risk levers and the live book's
        realized risk moved day to day?
      key_pattern: "predictor/optimizer_shadow/(?P<date>\\d{4}-\\d{2}-\\d{2})\\.json$"
      id_template: "{date}"          # whole-body — no fan-out
      state_field: shadow_status
      fields:
        risk_aversion: {path: optimizer_cfg.risk_aversion}
        tcost_bps: {path: optimizer_cfg.tcost_bps}
        max_sector_pct: {path: optimizer_cfg.max_sector_pct, unit: pct}
        portfolio_vol_ann: {path: diagnostics.portfolio_vol_ann, unit: ratio}
        active_share_vs_spy: {path: diagnostics.active_share_vs_spy, unit: ratio}
        turnover_one_way: {path: diagnostics.turnover_one_way, unit: ratio}
        expected_alpha: {path: diagnostics.expected_alpha}

  # Evaluation & Backtesting slice (nousergon-console#57). Overlap
  # investigation: the former `Report_Card.py` (module-rollup framing) and
  # `Crucible_Evaluation.py` (per-tile metric-browser framing) both read this
  # ONE artifact and carry the same MetricRecord fields — merged into one
  # Signal-kind pane rather than two, per console-policy.md §4.4 ("same-
  # question, different-place is a fork"): the generic Signal list (facetable
  # by `tile`) plus each Signal's own entity page already serve both framings.
  - name: crucible-report-card
    kind: s3-records
    enabled: false
    produces: [signal]
    config:
      bucket: your-research-bucket
      prefix: evaluator/
      kind: signal                     # one Signal per (tile, component)
      question: >-
        What is the current institutional grade (RED/WATCH/GREEN) for each
        module/component, and why?
      key_pattern: "evaluator/(?P<date>\\d{4}-\\d{2}-\\d{2})/report_card\\.json$"
      # Grouped fan-out: neither a plain array nor parallel arrays reach
      # this — `tiles` is a dict keyed by tile name, each value carrying its
      # own `components` array. `*` iterates the dict; `group_field` injects
      # the tile name onto every component record it reaches.
      records_path: tiles.*.components
      group_field: tile
      id_template: "{tile}:{name}"
      state_field: status              # RED / WATCH / GREEN / N/A, verbatim
      fields:
        value: {path: value}
        ci_low: {path: ci_low}
        ci_high: {path: ci_high}
        n_samples: {path: n_samples, render: count}
        target: {path: target}
        red_line: {path: red_line}
        trend: {path: trend_decoration, render: text}
        criticality: {path: criticality, render: text}
        reason: {path: status_reason, render: text}

  - name: crucible-execution
    kind: s3-records
    enabled: false
    produces: [artifact]
    config:
      bucket: your-research-bucket
      prefix: backtest/
      kind: artifact                   # one Artifact per (date, filename)
      question: >-
        For a selected backtest run, how good were entry/exit timing, and
        did the risk guard add value?
      # Alternation over the three JSON files this pane covers — one adapter
      # instance, `filename` a named group available to id_template.
      key_pattern: "backtest/(?P<date>\\d{4}-\\d{2}-\\d{2})/(?P<filename>trigger_scorecard|exit_timing|shadow_book)\\.json$"
      id_template: "{date}:{filename}"
      cadence: 7d

  - name: crucible-execution-blotter
    kind: s3-records
    enabled: false
    produces: [artifact]
    config:
      bucket: your-research-bucket
      prefix: backtest/
      kind: artifact                   # one Artifact per date's order blotter
      question: >-
        For a selected backtest run, what orders did the engine place?
      key_pattern: "backtest/(?P<date>\\d{4}-\\d{2}-\\d{2})/all_orders\\.csv$"
      format: csv
      id_template: "{date}:all_orders.csv"
      cadence: 7d
      state_default: reported

  - name: crucible-validation
    kind: s3-records
    enabled: false
    produces: [signal]
    config:
      bucket: your-research-bucket
      prefix: backtest/
      kind: signal                     # one Signal per (backtest_date, check)
      question: >-
        For a selected backtest run, do integrity checks pass, and which
        sub-scores predict the 21-day outcome?
      key_pattern: "backtest/(?P<date>\\d{4}-\\d{2}-\\d{2})/(?P<filename>pit_parity|sample_size|walk_forward_stability|optimizer_churn|attribution)\\.json$"
      id_template: "{date}:{filename}"
      state_field: status
      cadence: 7d

  - name: crucible-validation-signal-quality
    kind: s3-records
    enabled: false
    produces: [signal]
    config:
      bucket: your-research-bucket
      prefix: backtest/
      kind: signal                     # one Signal per (backtest_date, ticker)
      question: >-
        For a selected backtest run, which per-signal sub-scores predict the
        21-day outcome?
      key_pattern: "backtest/(?P<date>\\d{4}-\\d{2}-\\d{2})/signal_quality\\.csv$"
      format: csv
      id_template: "{date}:{ticker}"
      cadence: 7d
      state_default: reported

  - name: crucible-feedback
    kind: s3-records
    enabled: false
    produces: [decision]
    config:
      bucket: your-research-bucket
      prefix: config/apply_audit/
      kind: decision                   # one Decision per (loop, as-of week)
      question: >-
        For each auto-apply optimizer loop, was this week's parameter change
        promoted, blocked, or gated — why?
      key_pattern: "config/apply_audit/latest\\.json$"
      # `loops` is a DICT keyed by loop id, not an array — same grouped
      # mechanism as `crucible-report-card`, one level shallower (no nested
      # array beneath the `*`, so the terminal dict-of-records branch applies).
      records_path: loops.*
      group_field: loop
      id_template: "{loop}:{as_of}"    # `as_of` is body-level, reachable via
      state_field: outcome             # the same body_root merge every shape uses
      fields:
        blocked_by: {path: blocked_by, render: text}
        consecutive_blocked_weeks: {path: consecutive_blocked_weeks, render: count}

  - name: crucible-feedback-configs
    kind: s3-records
    enabled: false
    produces: [decision]
    config:
      bucket: your-research-bucket
      prefix: config/autoapply/
      kind: decision                   # presence/absence IS the decision outcome
      question: >-
        Which live auto-apply config artifacts has the optimizer promoted?
      key_pattern: "config/autoapply/(?P<config_name>executor_params|scoring_weights|entry_thresholds|exit_rules)\\.json$"
      id_template: "config:{config_name}"
      state_default: promoted          # this adapter only sees keys that EXIST;
      # a config that has never promoted never writes this key at all — its
      # "NEVER WRITTEN" state is the ABSENCE of an entity here, not a value on
      # one, exactly like `object-store`'s "declared and not there" convention.

  - name: eval-quality
    kind: s3-records
    enabled: false
    produces: [signal]
    config:
      bucket: your-research-bucket
      prefix: decision_artifacts/_eval/
      kind: signal                     # one Signal per (agent, criterion, judge)
      question: >-
        Are LLM-agent outputs holding rubric-scored quality over time, per
        agent/criterion, and did a prompt bump move scores?
      key_pattern: "decision_artifacts/_eval/.*\\.json$"
      # judge_model/judged_agent_id sit BESIDE dimension_scores on the
      # enclosing body, not inside each score — reachable via body_root, same
      # as `as_of` above; no separate mechanism needed for that half.
      records_path: dimension_scores
      id_template: "{judged_agent_id}:{dimension}:{judge_model}"
      fields:
        score: {path: score}
        reasoning: {path: reasoning, render: text}
        rubric_id: {path: rubric_id, render: text}
        rubric_version: {path: rubric_version, render: text}

# Facets are fields on entities, faceted uniformly by the index. No view
# implements its own filtering. Listing a facet here makes it a slicing
# dimension everywhere; omitting one does not hide the field.
facets:
  - owner
  - substrate
  - repo
  - environment
  - authority_tier
  - lifecycle
  - pipeline

# Optional. Where the console's own execution telemetry goes — it is a component
# like any other, and a surface that cannot be seen to have stopped is the
# failure this whole project is about.
self:
  component_id: nousergon-console
  emit: stdout
