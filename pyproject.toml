[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nousergon-console"
version = "0.1.0"
description = "A read-only fleet index that persists nothing and reports what it cannot see."
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# `tests/test_coverage_scope.py` parses pyproject.toml with stdlib `tomllib`
# rather than adding a `tomli` fallback: `requires-python = ">=3.11"` above
# is enforced project-wide, so `tomllib` (3.11+) is guaranteed on every
# interpreter this project runs on — a fallback here would cover a Python
# version the project has already declared unsupported.
test = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.14,<0.17"]
aws = ["boto3>=1.34"]
# NYSE trading-calendar backing for the `pipeline-reliability` adapter's
# default TradingDayChecker. A generic, unaffiliated OSS library — not a
# fleet-specific dependency; see console/adapters/pipeline_reliability.py.
calendar = ["pandas-market-calendars>=4.0"]

[project.scripts]
nousergon-console = "console.__main__:main"

[tool.setuptools.packages.find]
include = ["console*"]

[tool.setuptools.package-data]
# The emission schema is part of the PUBLIC product contract (console-policy.md
# §2.6), not a build artifact — an installed console must be able to hand it to
# an emitter that wants to validate against it.
console = ["schemas/*.json", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# The whole `console` package, not a submodule or path — repository-baseline-
# policy.md §4.2 C1. Narrowing this measures the tested subset and reports it
# as the repository; measured on symposion, that moved a reported figure from
# 34.76% to 92.36% with no new test code. No `omit` list: every source file
# under `console/` is exercised by CI's `.[test]` install (aws/calendar
# extras are optional at *runtime* for two adapters, but their fallback paths
# without those extras are what the suite actually covers).
source = ["console"]

[tool.coverage.report]
# Raised from unenforced (test.yml ran plain `pytest tests/ -q`, no coverage
# step at all) to a floor set at measured coverage: 87.76% on 2026-09-10
# (alpha-engine-config-I10432 RB-4.2-C2). A floor is raised as coverage
# improves and never lowered to make a change pass
# (repository-baseline-policy.md §4.2 C3).
fail_under = 87
show_missing = true
skip_empty = true

[tool.ruff.lint]
# NARROW BY INTENT, not by taste. `F821` (undefined name) is the rule that
# would have caught `object_store._failed` — a helper three failure paths
# called and nothing defined, merged green because an adapter's own
# "I could not read this" path is exactly the path no ordinary run exercises
# (alpha-engine-config-I8765). The rest of the `F` ruleset finds 42 unused
# imports today; widening to it is mechanical and tracked, not silently
# skipped.
select = ["F821"]
