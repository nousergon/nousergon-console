[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nousergon-console"
version = "0.1.0"
description = "A read-only fleet index that persists nothing and reports what it cannot see."
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
aws = ["boto3>=1.34"]

[project.scripts]
nousergon-console = "console.__main__:main"

[tool.setuptools.packages.find]
include = ["console*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
